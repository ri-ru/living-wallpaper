<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Living Wallpaper</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background-color: #050607; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<canvas id="c"></canvas>
<canvas id="tx"></canvas>
<script>
window.__errs = [];
addEventListener('error', e => window.__errs.push(e.message + ' @' + e.lineno));
(() => {
const P = new URLSearchParams(location.search);
// The words. Priority: ?quote=... in the URL, then the host's quote.txt (window.__quote), then this default.
let QUOTE = P.get('quote') || window.__quote || 'Evil is whatever distracts.';
const S = +P.get('cell') || 10;            // aquarium cell size, css px
const FPS = +P.get('fps') || 15;           // measured on an M4 MacBook Air (13"): ~32% of one core at 15 fps, ~42% at 20 (sharks only)
const CATCHUP_STEP_MIN = 20;               // replaying time away (sleep, shutdown) in 20-minute steps
const TIME_SCALE = +P.get('timescale') || 1;   // tests speed up ageing
const WHALE_GAP_MIN = [20, 90];            // design choice: minutes between whale visits

// ---------- the species. All numbers are design choices; change them freely. ----------
// life, grow, cool: hours. rate: natural births per hour for the whole species. cap: most alive at once.
// min: below this many alive, newcomers of that species arrive. clutch: young per birth. size: fraction of the screen's short side.
const SPECIES = {
  hammer:  { db: 'hammerhead', label: 'hammerhead', body: 'swim',  life: [144, 192],   grow: 36,  rate: 0.08,  cool: 24,  cap: 12, min: 0,  clutch: [1, 1], pair: true,  size: [0.30, 0.42], depth: [0.55, 1.0], hunger: 7200, wave: 0.045, speed: 0.17 },
  leopard: { db: 'leopard',    label: 'leopard shark', body: 'swim', life: [144, 192], grow: 36,  rate: 0.08,  cool: 24,  cap: 12, min: 0,  clutch: [1, 1], pair: true,  size: [0.26, 0.36], depth: [0.55, 1.0], hunger: 7200, wave: 0.045, speed: 0.17 },
  manta:   { db: 'manta',      label: 'manta ray',  body: 'swim',  life: [240, 336],   grow: 48,  rate: 0.03,  cool: 72,  cap: 4,  min: 1,  clutch: [1, 1], pair: true,  size: [0.30, 0.40], depth: [0.45, 0.75], hunger: 0, wave: 0.008, speed: 0.07 },
  whale:   { db: 'whale',      label: 'whale',      body: 'swim',  life: [1440, 2160], grow: 168, rate: 0.004, cool: 720, cap: 3,  min: 1,  clutch: [1, 1], pair: true,  size: [1.20, 1.50], depth: [0.42, 0.48], hunger: 0, wave: 0.012, speed: 0.045, migrates: true },
  jelly:   { db: 'jellyfish',  label: 'jellyfish',  body: 'jelly', life: [72, 120],    grow: 12,  rate: 0.12,  cool: 18,  cap: 10, min: 3,  clutch: [1, 2], pair: false, size: [0.018, 0.026], depth: [0.6, 0.95], hunger: 0 },
  fish:    { db: 'fish',       label: 'fish',       body: 'fish',  life: [48, 72],     grow: 8,   rate: 0.6,   cool: 12,  cap: 60, min: 12, clutch: [3, 6], pair: true,  size: [1, 1], depth: [0.9, 0.9], hunger: 5400 },
  crab:    { db: 'crab',       label: 'crab',       body: 'crawl', life: [192, 288],   grow: 24,  rate: 0.08,  cool: 48,  cap: 8,  min: 2,  clutch: [1, 3], pair: true,  size: [1, 1], depth: [1, 1], hunger: 5400 },
  shrimp:  { db: 'shrimp',     label: 'shrimp',     body: 'crawl', life: [72, 96],     grow: 8,   rate: 0.2,   cool: 24,  cap: 12, min: 3,  clutch: [2, 4], pair: true,  size: [1, 1], depth: [1, 1], hunger: 5400 },
};
const KIND_OF_DB = Object.fromEntries(Object.entries(SPECIES).map(([k, s]) => [s.db, k]));
const isShark = a => a.kind === 'hammer' || a.kind === 'leopard';

// Host bridge. Every host (macOS, Windows, Linux) accepts one message: a JSON transaction of SQL statements.
// WebKit hosts (macOS WKWebView, Linux WebKitGTK) expose messageHandlers.sql; WebView2 (Windows) exposes chrome.webview.
// With no host (a plain browser) nothing is saved.
const HOST = (() => {
  const wk = window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.sql;
  if (wk) return tx => wk.postMessage(JSON.stringify({ tx }));
  const cw = window.chrome && window.chrome.webview;
  if (cw) return tx => cw.postMessage(JSON.stringify({ tx }));
  return null;
})();
const TANK = window.__tank || null;    // rows the host loaded with web/load.json at startup
const wall = () => Date.now() * TIME_SCALE;

// ---------- canvases: slow background, main, and the words ----------
const cv = document.getElementById('c'), mainCtx = cv.getContext('2d');
const bgv = document.getElementById('bg'), bgCtx = bgv.getContext('2d');
const txv = document.getElementById('tx'), txCtx = txv.getContext('2d');
let ctx = mainCtx;   // tile() draws into whichever layer ctx points at
const field = document.createElement('canvas'), fctx = field.getContext('2d', { willReadFrequently: true });
const dfield = document.createElement('canvas'), dctx = dfield.getContext('2d', { willReadFrequently: true });
let W, H, M, DPR, cols, rows, cellRand, T, floorY, lastBg = -1e9;
function resize() {
  DPR = window.devicePixelRatio || 1; W = innerWidth; H = innerHeight; M = Math.min(W, H);
  for (const [c, g] of [[cv, mainCtx], [bgv, bgCtx], [txv, txCtx]]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); g.setTransform(DPR, 0, 0, DPR, 0, 0); }
  cols = Math.ceil(W / S); rows = Math.ceil(H / S); floorY = (rows - 2) * S;
  field.width = dfield.width = cols; field.height = dfield.height = rows;
  cellRand = new Float32Array(cols * rows).map(() => Math.random());
  document.body.style.backgroundImage = 'linear-gradient(#0e1112 1px, transparent 1px), linear-gradient(90deg, #0e1112 1px, transparent 1px)';
  document.body.style.backgroundSize = `${S}px ${S}px`;
  specks = Array.from({ length: Math.round(cols * rows / 110) }, () => ({ x: Math.random() * W, y: Math.random() * H, v: 2 + Math.random() * 5, a: 0.15 + Math.random() * 0.25 }));
  buildAtlas(); drawWords(); lastBg = -1e9;
  for (const a of animals) if (SPECIES[a.kind].body === 'crawl') a.y = crawlRow();
}

// ---------- tile atlas: (hue, level, glyph) -> small tile ----------
const GLYPHS = '.:-otsxSX%8#@,*♥<>^v()~|';
const LEVEL_GLYPHS = ['.:-', ':-o', 'ts:o', 'tsxS', 'SX%8', '%8#@'];
const HUES = { blue: [150, 160, 182], tan: [168, 153, 122], grey: [120, 122, 124], pink: [214, 110, 160], teal: [110, 176, 168],
               violet: [150, 130, 205], gold: [205, 170, 90], sand: [120, 108, 84], coral: [222, 118, 88], silver: [190, 205, 215] };
const HUE_NAMES = Object.keys(HUES), LEVELS = 6;
const HI = n => HUE_NAMES.indexOf(n);
// Big animals are drawn as shapes into a tiny canvas; each lit cell takes the nearest of these hues.
const RASTER_HUES = ['blue', 'tan', 'pink', 'violet', 'teal'].map(n => { const c = HUES[n], s = c[0] + c[1] + c[2]; return [HI(n), c[0] / s, c[1] / s, c[2] / s]; });
function nearestHue(r, g, b) {
  if (Math.max(r, g, b) - Math.min(r, g, b) < 45) return b > r ? RASTER_HUES[0][0] : RASTER_HUES[1][0];   // muted: blue-grey or tan
  const s = r + g + b || 1, nr = r / s, ng = g / s, nb = b / s; let best = RASTER_HUES[0][0], bd = 9;
  for (const [h, hr, hg, hb] of RASTER_HUES) { const d = (nr - hr) ** 2 + (ng - hg) ** 2 + (nb - hb) ** 2; if (d < bd) { bd = d; best = h; } }
  return best;
}
const atlas = document.createElement('canvas'), actx = atlas.getContext('2d');
const bubbleAtlas = document.createElement('canvas');
function buildAtlas() {
  T = Math.round(S * DPR);
  atlas.width = GLYPHS.length * T; atlas.height = HUE_NAMES.length * LEVELS * T;
  actx.textAlign = 'center'; actx.textBaseline = 'middle';
  actx.font = `500 ${Math.round(T * 0.92)}px Menlo, "SF Mono", Monaco, Consolas, "DejaVu Sans Mono", monospace`;
  HUE_NAMES.forEach((h, hi) => {
    const [r, g, b] = HUES[h];
    for (let l = 0; l < LEVELS; l++) {
      const k = 0.2 + 0.5 * l / (LEVELS - 1), gk = 0.62 + 0.62 * l / (LEVELS - 1);
      const bg = `rgb(${r * k | 0},${g * k | 0},${b * k | 0})`;
      const fg = `rgb(${Math.min(255, r * gk + 20) | 0},${Math.min(255, g * gk + 20) | 0},${Math.min(255, b * gk + 20) | 0})`;
      for (let c = 0; c < GLYPHS.length; c++) {
        const x = c * T, y = (hi * LEVELS + l) * T, inset = Math.max(1, Math.round(T * 0.08));
        actx.fillStyle = bg; actx.fillRect(x + inset, y + inset, T - inset * 2, T - inset * 2);
        actx.fillStyle = fg; actx.fillText(GLYPHS[c], x + T / 2, y + T / 2 + T * 0.04);
      }
    }
  });
  bubbleAtlas.width = 4 * T; bubbleAtlas.height = T;           // loose glyphs: bubbles and specks
  const g = bubbleAtlas.getContext('2d');
  g.font = `400 ${Math.round(T * 0.9)}px Menlo, monospace`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = 'rgb(170,200,210)';
  [...'.oO-'].forEach((c, i) => g.fillText(c, i * T + T / 2, T / 2));
}
const GI = {}; [...GLYPHS].forEach((c, i) => GI[c] = i);
function tile(hue, level, glyph, x, y, alpha) {
  ctx.globalAlpha = alpha;
  ctx.drawImage(atlas, glyph * T, (hue * LEVELS + level) * T, T, T, Math.floor(x / S) * S, Math.floor(y / S) * S, S, S);
}
function glyphFor(level, cell, t) {
  const set = LEVEL_GLYPHS[level], r = cellRand[cell];
  return GI[set[(r * 97 + Math.floor(t * 0.0006 + r * 5)) % set.length | 0]];
}

// ---------- the words: fine dots; big swimmers feast through them, then the letters settle back ----------
const TS = 2;                                                   // text dot pitch, css px
let dots = [], textBox = { x0: 0, y0: 0, x1: 0, y1: 0 }, textDirty = true, wasMoving = true;
function layoutWords(g) {
  const fs = Math.round(Math.min(W * 0.085, 150) * 0.7);
  g.font = `400 ${fs}px "Iowan Old Style", "Hoefler Text", "Palatino Linotype", Georgia, "DejaVu Serif", serif`;
  const lines = [];
  for (const para of QUOTE.split('\n')) {                    // explicit line breaks in quote.txt are kept
    let cur = '';
    for (const w of para.split(' ')) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > W * 0.7 && cur) { lines.push(cur); cur = w; } else cur = t; }
    lines.push(cur);
  }
  const lh = fs * 1.15, top = H * 0.46 - (lines.length - 1) * lh / 2, maxw = Math.max(...lines.map(l => g.measureText(l).width)), left = (W - maxw) / 2;
  return { fs, lines, lh, top, maxw, left };
}
function drawWords() {
  const off = document.createElement('canvas'), g = off.getContext('2d', { willReadFrequently: true });
  off.width = Math.round(W * DPR); off.height = Math.round(H * DPR); g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const L = layoutWords(g);
  g.fillStyle = '#000'; g.textBaseline = 'middle';
  L.lines.forEach((l, i) => g.fillText(l, L.left, L.top + i * L.lh));
  const d = g.getImageData(0, 0, off.width, off.height).data;
  dots = [];
  for (let y = 0; y < H; y += TS) for (let x = 0; x < W; x += TS) {
    const k = (Math.round((y + TS / 2) * DPR) * off.width + Math.round((x + TS / 2) * DPR)) * 4;
    if (d[k + 3] > 110) dots.push({ hx: x, hy: y, x, y, vx: 0, vy: 0, r: Math.random() });
  }
  textBox = { x0: L.left - 40, x1: L.left + L.maxw + 40, y0: L.top - L.fs, y1: L.top + (L.lines.length - 1) * L.lh + L.fs };
  textDirty = true;
}
// Push dots away from (x, y); returns how many were hit, so an animal can count what it ate.
function kick(x, y, radius, power) {
  if (x + radius < textBox.x0 || x - radius > textBox.x1 || y + radius < textBox.y0 - 60 || y - radius > textBox.y1 + 60) return 0;
  const r2 = radius * radius; let hit = 0;
  for (const p of dots) {
    const dx = p.x - x, dy = p.y - y, d2 = dx * dx + dy * dy;
    if (d2 < r2) { hit++; const d = Math.sqrt(d2) || 1, f = (1 - d / radius) * power; p.vx += dx / d * f + (Math.random() - .5) * f * 0.4; p.vy += dy / d * f + (Math.random() - .5) * f * 0.4; }
  }
  return hit;
}
function updateDots(dt) {
  for (const a of animals) {
    if (a.dead || !shown(a)) continue;
    if (a.sp) {                                                 // swimmers plough through and feast on the words
      let ate = 0;
      for (let i = 0; i < a.sp.length; i += 3) { const p = a.sp[i]; ate += kick(p.x, p.y, width(a, p.u) * a.len * 1.6 + 8, 26 * a.depth); }
      if (ate && isShark(a)) a.full = Math.min(1, a.full + ate * 0.000004);
    } else if (a.kind === 'jelly') kick(a.x, a.y, a.len * 1.4, 6);
  }
  let moving = false;
  for (const p of dots) {
    const ox = p.hx - p.x, oy = p.hy - p.y;
    if (ox * ox + oy * oy < 0.02 && p.vx * p.vx + p.vy * p.vy < 0.05) { p.x = p.hx; p.y = p.hy; p.vx = p.vy = 0; continue; }
    moving = true;
    const k = 9 * (0.6 + p.r), damp = Math.pow(0.02, dt);
    p.vx += ox * k * dt; p.vy += oy * k * dt; p.vx *= damp; p.vy *= damp; p.x += p.vx * dt; p.y += p.vy * dt;
  }
  textDirty = textDirty || moving || wasMoving;                 // one last redraw after the dots settle
  wasMoving = moving;
}
function paintWords() {
  if (!textDirty) return;
  textDirty = false;
  txCtx.clearRect(0, 0, W, H); txCtx.fillStyle = '#ececec';
  for (const p of dots) txCtx.fillRect(p.x, p.y, TS, TS);
}

// ---------- names, families, events (stored by the host in SQLite) ----------
const SYL = ['ka', 'mi', 'ro', 've', 'lu', 'sa', 'ti', 'no', 'be', 'ra', 'do', 'ze', 'fi', 'ol', 'an', 'ish', 'um', 'pe', 'yo', 'ki'];
const usedNames = new Set(((TANK && TANK.names) || []).map(r => r.name));   // every name ever given, the dead included
const newName = () => {
  for (let i = 0; i < 400; i++) {
    const parts = 2 + (i > 150 ? 1 : 0), n = Array.from({ length: parts }, () => SYL[Math.random() * SYL.length | 0]).join('');
    const name = n[0].toUpperCase() + n.slice(1);
    if (!usedNames.has(name)) { usedNames.add(name); return name; }
  }
  return 'Nameless' + nextId;
};
const FAMILY_HUES = ['teal', 'pink', 'violet', 'gold'];
let families = [], log = [], nextId = 1;
const famOf = a => families.find(f => f.id === a.family) || {};
const clock = () => new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function event(kind, text, animal, atMs) {                   // atMs: real time it happened (default: now)
  log.push({ t: performance.now(), line: `${atMs ? hhmm(atMs) : clock()}  ${text}` }); if (log.length > 300) log.shift();
  if (HOST) HOST([[`INSERT INTO events (at, kind, animal_id, text)
                    VALUES (coalesce(datetime(? / 1000, 'unixepoch', 'localtime'), datetime('now', 'localtime')), ?, (SELECT id FROM animals WHERE id = ?), ?)`,
                   [atMs ?? null, kind, animal ? animal.id : null, text]]]);
}
let lastSave = 0;
function save(force) {
  if (!HOST) return;
  const now = performance.now(); if (!force && now - lastSave < 5000) return; lastSave = now;
  const tx = families.map(f => ['INSERT INTO families (id, name, hue) VALUES (?, ?, ?) ON CONFLICT(id) DO UPDATE SET name = excluded.name, hue = excluded.hue', [f.id, f.name, f.hue]]);
  for (const a of [...animals].sort((p, q) => p.id - q.id)) {     // parents before children (foreign keys)
    const born = Math.round(a.born / TIME_SCALE);
    tx.push([`INSERT INTO animals (id, name, species, family_id, generation, parent_a_id, parent_b_id, born_at, born_ms, lifespan_hours,
                                   died_at, cause_of_death, length, adult_length, depth, fullness, love)
              VALUES (?, ?, ?, ?, ?, ?, ?, datetime(? / 1000, 'unixepoch', 'localtime'), ?, ?, ?, ?, ?, ?, ?, ?, ?)
              ON CONFLICT(id) DO UPDATE SET length = excluded.length, fullness = excluded.fullness, love = excluded.love,
                died_at = coalesce(animals.died_at, excluded.died_at), cause_of_death = coalesce(animals.cause_of_death, excluded.cause_of_death)`,
      [a.id, a.name, SPECIES[a.kind].db, a.family, a.gen, a.parents[0] ?? null, a.parents[1] ?? null,
       born, born, a.lifespan / 3600000, a.diedAt || null, a.cause || null, a.len, a.adultLen, a.depth, a.full, a.love]]);
    const t = a.traits;                                            // traits never change, so insert once
    tx.push([`INSERT INTO animal_traits (animal_id, girth, fins, tail, head, speed, tint_r, tint_g, tint_b, variant, pattern_seed)
              VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT(animal_id) DO NOTHING`,
      [a.id, t.girth, t.fins, t.tail, t.head, t.speed, t.tint[0], t.tint[1], t.tint[2], t.variant, t.seed]]);
  }
  tx.push(["INSERT INTO meta (key, value) VALUES ('last_seen_ms', ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value", [String(Date.now())]]);
  HOST(tx);
}
const fmtAge = ms => { const m = Math.round(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return m < 60 ? `${m}m` : h < 24 ? `${h}h${String(m % 60).padStart(2, '0')}m` : `${d}d${h % 24}h`; };
const localStamp = (ms = Date.now()) => { const d = new Date(ms), z = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`; };
const hhmm = ms => { const d = new Date(ms), z = n => String(n).padStart(2, '0'); return `${z(d.getHours())}:${z(d.getMinutes())}`; };

// ---------- individual looks: inherited from the parents, with small mutations ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;   // roughly -1..1, peaked at 0
const rand = ([a, b]) => a + Math.random() * (b - a);
function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function randomTraits() {
  const r = Math.random();
  return { girth: 1 + gauss() * 0.15, fins: 1 + gauss() * 0.2, tail: 1 + gauss() * 0.2, head: 1 + gauss() * 0.15, speed: 1 + gauss() * 0.12,
    tint: [0, 0, 0].map(() => Math.round(gauss() * 18)), variant: r < 0.04 ? 'pale' : r < 0.08 ? 'dark' : 'common', seed: Math.random() * 2 ** 31 | 0 };
}
function inheritTraits(a, b) {
  b = b || a;                                                     // budding jellyfish have one parent
  const mix = k => clamp((a[k] + b[k]) / 2 + gauss() * 0.06, 0.7, 1.35);
  const variant = Math.random() < 0.03 ? (Math.random() < 0.5 ? 'pale' : 'dark') : (Math.random() < 0.5 ? a.variant : b.variant);
  return { girth: mix('girth'), fins: mix('fins'), tail: mix('tail'), head: mix('head'), speed: clamp((a.speed + b.speed) / 2 + gauss() * 0.04, 0.8, 1.25),
    tint: a.tint.map((t, i) => Math.round((t + b.tint[i]) / 2 + gauss() * 6)), variant, seed: Math.random() * 2 ** 31 | 0 };
}
function describe(a) {
  const t = a.traits, d = [];
  if (t.variant !== 'common') d.push(t.variant);
  if (t.girth > 1.12) d.push('stout'); else if (t.girth < 0.88) d.push('slender');
  if (t.fins > 1.15) d.push(a.kind === 'jelly' ? 'long-tentacled' : a.kind === 'manta' ? 'wide-winged' : 'broad-finned');
  if (t.tail > 1.15) d.push('long-tailed');
  if (t.speed > 1.1) d.push('quick'); else if (t.speed < 0.9) d.push('slow');
  return d.join(', ');
}
function shade(a, base) {                                         // species colour + this animal's tint and variant
  const t = a.traits;
  let c = base.map((v, i) => clamp(v + t.tint[i], 30, 240));
  if (t.variant === 'pale') c = c.map(v => v * 0.4 + 140);
  if (t.variant === 'dark') c = c.map(v => v * 0.62);
  return c;
}

// ---------- animals ----------
const N = 26;                                                     // spine points of a swimmer
const animals = [];
const shown = a => !SPECIES[a.kind].migrates || a.visiting;       // whales are away most of the time
const living = () => animals.filter(a => !a.dead && !a.diedAt);
const ofKind = k => living().filter(a => a.kind === k);
const isBaby = a => a.len < a.adultLen * 0.85;
const byId = id => animals.find(a => a.id === id && !a.dead && !a.diedAt);
const crawlRow = () => floorY - S * (Math.random() < 0.5 ? 1 : 2);
const lifeOf = kind => rand(SPECIES[kind].life) * 3600000;
const headOf = a => a.pts ? a.pts[0] : a;
function makeAnimal(o) {
  const sp = SPECIES[o.kind];
  const x = o.x ?? Math.random() * W, y = o.y ?? (0.1 + Math.random() * 0.75) * H, ang = o.a ?? Math.random() * Math.PI * 2;
  const a = Object.assign({ id: nextId++, love: 0, full: 0.6, gen: 1, parents: [], born: wall(), lifespan: lifeOf(o.kind), depth: rand(sp.depth) }, o,
    { x, y, a: ang, vx: Math.cos(ang) * 20, vy: Math.sin(ang) * 20, phase: Math.random() * 10, tx: x, ty: y, tt: 0,
      orbit: Math.random() * Math.PI * 2, spinUntil: 0, tagUntil: 0, dead: null, hop: null, yo: 0 });

      for (const p of a.pts) {
        const cx = Math.floor(p.x / S), cy = Math.floor(p.y / S), rad = Math.ceil(a.len * 0.25 / S);
        for (let y = cy - rad; y <= cy + rad; y++) for (let x = cx - rad; x <= cx + rad; x++)
          if (x >= 0 && y >= 0 && x < cols && y < rows) decayMap[y * cols + x] = Math.max(decayMap[y * cols + x], dcy);
      }
    }
  }

  // slow layer: light from above and the sand (~5 fps)
  if (now - lastBg > 200) {
    lastBg = now; ctx = bgCtx; ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H);
    for (let i = 0; i < 3; i++) {
      const x = W * (0.5 + 0.45 * Math.sin(now * 0.00005 * (i + 1) + i * 2)), y = H * (0.3 + 0.2 * Math.cos(now * 0.00007 * (i + 2) + i));
      const r = M * (0.35 + 0.1 * i), gr = ctx.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(70,120,140,0.06)'); gr.addColorStop(1, 'rgba(70,120,140,0)');
      ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    const sand = HI('sand');
    for (let cx = 0; cx < cols; cx++) {
      const r = cellRand[cx], y = (rows - 1) * S;
      tile(sand, r < 0.5 ? 0 : 1, GI[r < 0.3 ? '.' : r < 0.6 ? ',' : r < 0.85 ? ':' : 'o'], cx * S, y, 0.75);
      if (r < 0.35) tile(sand, 0, GI[r < 0.15 ? '.' : ','], cx * S, y - S, 0.45);
    }
    ctx = mainCtx;
  }

  ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H);
  for (const s of specks) {
    s.x += s.v * dt; if (s.x > W + S) s.x = -S;
    ctx.globalAlpha = s.a; ctx.drawImage(bubbleAtlas, 3 * T, 0, T, T, Math.floor(s.x / S) * S, Math.floor(s.y / S) * S, S, S);
  }
  if (dd) rasterTiles(dd, decayMap);                               // bodies behind the living
  const gold = HI('gold');                                         // food: sinks; food from a body first bobs up
  food = food.filter(f => now < f.until);
  for (const f of food) {
    f.v = Math.min(f.v + 30 * dt, 14 + (f.w % 1) * 10); f.y = Math.min(floorY, f.y + f.v * dt);
    tile(gold, 4, GI['*'], f.x + Math.sin(now * 0.002 + f.w) * 3, f.y, 1);
  }
  const coral = HI('coral'), pink = HI('pink');                    // crabs and shrimp on the sand
  for (const c of animals) {
    if (SPECIES[c.kind].body !== 'crawl') continue;
    const al = c.dead ? Math.max(0, 1 - (now - c.dead.t) / 3000) : 1, y = c.y + c.yo, lv = isBaby(c) ? 3 : 4;
    if (c.kind === 'crab') {
      if (isBaby(c)) tile(coral, 3, GI['o'], c.x, y, al);
      else { const open = Math.sin(now * 0.006 + c.id) > 0; tile(coral, lv, GI[open ? '(' : '<'], c.x - S, y, al); tile(coral, 5, GI['@'], c.x, y, al); tile(coral, lv, GI[open ? ')' : '>'], c.x + S, y, al); }
    } else {
      const d = c.dir || 1;
      if (isBaby(c)) tile(pink, 3, GI['.'], c.x, y, al);
      else { tile(pink, lv - 1, GI['~'], c.x - d * S, y, al); tile(pink, lv, GI[d > 0 ? '>' : '<'], c.x, y, al); }
    }
  }
  rasterTiles(fd, null);
  for (const a of animals) {                                       // family colour along each living shark's back
    if (a.dead || !isShark(a)) continue;
    const fh = HI(famOf(a).hue || 'teal');
    for (let i = 3; i < a.sp.length * 0.7; i += 5) { const p = a.sp[i]; tile(fh, 3, GI['%'], p.x, p.y, 0.9 * (0.5 + 0.5 * a.depth)); }
  }
  for (const f of animals) {                                       // fish: a head that points the way, and a tail
    if (f.kind !== 'fish') continue;
    const al = f.dead ? Math.max(0, 1 - (now - f.dead.t) / 400) : 1, hue = HI(famOf(f).hue === 'pink' ? 'silver' : famOf(f).hue || 'silver');
    const baby = isBaby(f), g = FISH_GLYPH(f.vx, f.vy), v = Math.hypot(f.vx, f.vy) || 1;
    tile(hue, baby ? 4 : 5, GI[baby ? 'o' : g], f.x, f.y, al);
    if (!baby) tile(hue, 4, GI[Math.abs(f.vx) > Math.abs(f.vy) ? '-' : ':'], f.x - f.vx / v * S, f.y - f.vy / v * S, al * 0.8);
  }
  if (Math.random() < dt * 0.6) bubbles.push(bubble(Math.random() * W, H - S * 2));
  bubbles = bubbles.filter(b => b.y > -S);
  for (const b of bubbles) {
    b.y -= b.v * dt; const x = b.x + Math.sin(now * 0.003 + b.w) * 4;
    ctx.globalAlpha = 0.55; ctx.drawImage(bubbleAtlas, b.g * T, 0, T, T, Math.floor(x / S) * S, Math.floor(b.y / S) * S, S, S);
  }
  hearts = hearts.filter(h => (h.life -= dt) > 0);
  for (const h of hearts) { h.y -= h.v * dt; tile(pink, 5, GI['♥'], h.x + Math.sin(now * 0.004 + h.w) * 6, h.y, Math.min(1, h.life)); }

  ctx.font = '500 11px Menlo, Consolas, monospace'; ctx.textBaseline = 'middle';
  for (const a of animals) if (now < a.tagUntil) {                 // name tags of loved animals
    const p = headOf(a), looks = describe(a);
    ctx.globalAlpha = Math.min(1, (a.tagUntil - now) / 800) * 0.9; ctx.fillStyle = '#f2d9e6';
    ctx.fillText(`${a.name} · ${SPECIES[a.kind].label} · gen ${a.gen} · ${famOf(a).name || ''} · ${fmtAge(wall() - a.born)}${looks ? ' · ' + looks : ''} ${'♥'.repeat(Math.min(a.love, 5))}`, p.x + 16, (p.y + (a.yo || 0)) - 16);
  }
  const recent = log.slice(-5);                                    // recent events, bottom-left
  recent.forEach((l, i) => {
    const fresh = (now - l.t) / 1000 < 8 ? 1 : 0.5;
    ctx.globalAlpha = (0.25 + 0.12 * (i + 1)) * fresh; ctx.fillStyle = '#cfd6d8';
    ctx.fillText(l.line, 28, H - 44 - (recent.length - 1 - i) * 15);
  });
  ctx.globalAlpha = 1;
  paintWords();
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
